<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src *; img-src * data:;">
<title>Chat Plugin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { text-align: center; padding: 2rem; border-radius: 12px; background: #1e293b; border: 1px solid #334155; }
  h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
  p { color: #94a3b8; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Chat Plugin</h1>
  <p>chat.core v0.1.0</p>
</div>
<script>
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "linkos.host.init") {
      window.parent.postMessage({ type: "linkos.plugin.ready", id: event.data.id, pluginId: "chat.core" }, "*");
    }
  });
</script>
</body>
</html>
