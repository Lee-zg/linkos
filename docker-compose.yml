services:
  gateway:
    image: ${LINKOS_IMAGE:-ghcr.io/lee-zg/linkos:0.1.0}
    command: ["serve", "--home", "/var/lib/linkos"]
    ports:
      - "${LINKOS_BIND_IP:-0.0.0.0}:${LINKOS_PORT:-8787}:8787"
    volumes:
      - linkos-data:/var/lib/linkos
    healthcheck:
      test: ["CMD", "linkos", "healthcheck", "--home", "/var/lib/linkos"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  linkos-data:
