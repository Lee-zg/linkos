name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linkos/web typecheck
      - run: pnpm test:web
      - run: pnpm --filter @linkos/web build
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...
        working-directory: services/${{ matrix.service }}

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go test ./services/gateway/... ./services/runner/...
      - run: pnpm --filter @linkos/web typecheck
      - run: pnpm --filter @linkos/web build

  runner-container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./services/runner/...
      - run: docker build -t linkos-runner-ci ./services/runner
      - run: docker run --rm --entrypoint sh linkos-runner-ci -c 'test "$(id -u)" -ne 0'
